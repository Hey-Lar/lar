name: LarApp
options:
  bundleIdPrefix: me.heylar
  deploymentTarget:
    iOS: "18.0"
targets:
  LarApp:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: Web
        type: folder
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        NSLocalNetworkUsageDescription: "Finds the devices already living in your house — speakers, bridges, printers — so Lar can show them. Nothing leaves the network."
        NSBonjourServices:
          - _hap._tcp
          - _googlecast._tcp
          - _airplay._tcp
          - _raop._tcp
          - _ipp._tcp
          - _spotify-connect._tcp
          - _companion-link._tcp
          - _http._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.heylar.LarApp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Lar listens only while the mic is open, to hear what you ask."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turns your voice into the question you asked Lar."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Puts the real sky over your world — weather, sun and seasons follow where you are."
        INFOPLIST_KEY_NSAppTransportSecurity: "{ NSAllowsLocalNetworking = YES; }"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
