name: Security

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, master]
  schedule:
    # Sunday 02:00 UTC weekly scan independent of activity.
    - cron: '0 2 * * 0'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so back-fills are scanned too
      # Run the gitleaks CLI directly (MIT, free) instead of
      # gitleaks/gitleaks-action@v2 — the action wrapper requires a paid
      # license key for organization-owned repos; the binary does not.
      # Fail-closed: any finding (or tool error) fails the job.
      - name: Run gitleaks (full history)
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose
